[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "synthermia"
version = "0.1.0"
description = "Terminal Synthesia-style MIDI visualizer with optional native acceleration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "dbus-next>=0.2.3",
  "pyfluidsynth",
]
authors = [
  { name = "Synthermia contributors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
synthermia = "synthermia.cli:main"

[tool.maturin]
bindings = "pyo3"
module-name = "synthermia_native"
manifest-path = "Cargo.toml"
python-packages = ["synthermia"]
exclude = ["CLAUDE.md", "AGENTS.md", "refactor_plan.md"]
include = [
  { path = "main.py", format = "sdist" },
  { path = "tests/**/*.py", format = "sdist" },
  { path = "tools/check_wheel.py", format = "sdist" },
  { path = "tools/generate_sample.py", format = "sdist" },
  { path = "tools/record_demo.py", format = "sdist" },
  { path = "examples/*.mid", format = "sdist" },
  { path = "docs/demo.gif", format = "sdist" },
]
