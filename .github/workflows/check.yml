name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python fallback
        run: |
          python -m py_compile main.py synthermia/*.py
          python main.py --help
          python -m unittest discover -v
      - name: Check native loaders
        run: |
          cargo check --locked
          cargo build --locked
          cp target/debug/libsynthermia_native.so synthermia_native.so
          SYNTHERMIA_REQUIRE_NATIVE=1 python -m unittest discover -v
      - name: Build and install from source distribution
        run: |
          maturin sdist --out dist
          mkdir -p /tmp/synthermia-sdist
          tar -xzf dist/synthermia-0.1.0.tar.gz -C /tmp/synthermia-sdist
          maturin build --release --locked --manifest-path /tmp/synthermia-sdist/synthermia-0.1.0/Cargo.toml --out dist
          python tools/check_wheel.py dist/synthermia-0.1.0-*.whl
